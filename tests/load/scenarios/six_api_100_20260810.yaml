schema_version: "1.0"

# Third full-service production pressure profile. Weights use successful
# production creates observed from 2026-08-03 through 2026-08-10, with a 5%
# floor for the otherwise-unused retopology-audit route so all six public
# contracts receive real coverage. The 100-user plateau is the approved hard
# ceiling for this run; no 120-user stage is included.
weights_confirmed: true
weights:
  imageclip_batch: 29
  modelview_roughness: 4
  uv_process: 12
  retopology_audit: 5
  retopology_process: 35
  substance_bake: 15

stages:
  - users: 1
    spawn_rate: 1
    duration_seconds: 60
  - users: 10
    spawn_rate: 2
    duration_seconds: 120
  - users: 25
    spawn_rate: 5
    duration_seconds: 180
  - users: 50
    spawn_rate: 10
    duration_seconds: 300
  - users: 100
    spawn_rate: 20
    duration_seconds: 600

poll_interval_seconds: 3
max_retries: 4
lifecycle_mode: bounded_stress
max_backup_age_hours: 24
operation_timeout_seconds:
