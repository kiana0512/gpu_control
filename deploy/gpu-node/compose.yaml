name: gpu-control-node
x-logging: &default-logging
  driver: json-file
  options: {max-size: "20m", max-file: "5"}

services:
  comfyui:
    image: ${COMFY_IMAGE:-registry.local:5000/gpu-control/comfyui:projects-0.2.3}
    restart: unless-stopped
    ports: ["${NODE_BIND_IP:-0.0.0.0}:8188:8188"]
    deploy: {resources: {reservations: {devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]}}}
    volumes:
      - ${MODEL_ROOT:-/opt/imageclip/models}:/opt/comfyui/models:ro
      - ${MODELVIEW_ROOT:-/opt/modelviewcreator}/model:/opt/modelviewcreator/model:ro
      - ../../configs/comfyui-extra-model-paths.yaml:/opt/comfyui/extra_model_paths.yaml:ro
      - ${IMAGECLIP_ROOT:-/opt/imageclip}/Cherry_lizi:/opt/comfyui/custom_nodes/Cherry_lizi:ro
      - ${MODELVIEW_ROOT:-/opt/modelviewcreator}/custom_nodes/haoze-LiClick:/opt/comfyui/custom_nodes/haoze-LiClick:ro
      - /srv/comfyui/runtime/input:/opt/comfyui/input
      - /srv/comfyui/runtime/output:/opt/comfyui/output
      - /srv/comfyui/runtime/temp:/opt/comfyui/temp
      - /srv/comfyui/runtime/user:/opt/comfyui/user
      - ${IMAGECLIP_ROOT:-/opt/imageclip}/ImageClip.json:/opt/comfyui/user/default/workflows/ImageClip.json:ro
      - ${MODELVIEW_ROOT:-/opt/modelviewcreator}/flux_fill_inpaint.json:/opt/comfyui/user/default/workflows/ModelViewCreator_flux_fill_inpaint.json:ro
    healthcheck: {test: ["CMD", "python3.11", "/usr/local/bin/comfy-healthcheck"], interval: 20s, timeout: 5s, start_period: 120s, retries: 6}
    logging: *default-logging

  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    ports: ["${NODE_BIND_IP:-0.0.0.0}:9100:9100"]
    command: ["--path.rootfs=/host"]
    volumes: ["/:/host:ro,rslave"]
    logging: *default-logging

  dcgm-exporter:
    image: nvcr.io/nvidia/k8s/dcgm-exporter:4.2.3-4.1.1-ubuntu22.04
    restart: unless-stopped
    ports: ["${NODE_BIND_IP:-0.0.0.0}:9400:9400"]
    deploy: {resources: {reservations: {devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]}}}
    cap_add: [SYS_ADMIN]
    logging: *default-logging

  alloy:
    image: grafana/alloy:v1.9.1
    restart: unless-stopped
    command: ["run", "/etc/alloy/config.alloy", "--storage.path=/var/lib/alloy/data"]
    environment: {NODE_ID: "${NODE_ID}", CONTROL_HOST: "${CONTROL_HOST}"}
    volumes: ["./alloy/worker.alloy:/etc/alloy/config.alloy:ro", "/var/run/docker.sock:/var/run/docker.sock:ro", "/var/log/journal:/var/log/journal:ro", "/run/log/journal:/run/log/journal:ro", "/etc/machine-id:/etc/machine-id:ro", "alloy-data:/var/lib/alloy/data"]
    logging: *default-logging

  blender-worker:
    profiles: ["asset-plane"]
    build:
      context: ../..
      dockerfile: apps/blender_worker/Dockerfile
      args:
        BLENDER_BASE_IMAGE: ${BLENDER_BASE_IMAGE:-li3d/blender-runtime:5.1.2}
        ASSET_WORKER_VERSION: ${ASSET_WORKER_VERSION:-1.3.3-retopo-direct-v2}
        GPU_CONTROL_REVISION: ${GPU_CONTROL_REVISION:-unknown}
    image: li3d/blender-worker:${ASSET_WORKER_IMAGE_TAG:-1.3.3-retopo-direct-v2}
    restart: unless-stopped
    # Required for Codex's nested bubblewrap workspace sandbox.
    cap_add: [SYS_ADMIN]
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    environment:
      ASSET_API_URL: https://${CONTROL_HOST}
      ASSET_WORKER_ID: asset-${NODE_ID}
      ASSET_NODE_ID: ${NODE_ID}
      ASSET_WORKER_DISPLAY_NAME: ${NODE_ID} CPU Worker
      ASSET_WORKER_HMAC_SECRET: ${ASSET_WORKER_HMAC_SECRET}
      ASSET_WORKER_MAX_CONCURRENCY: ${ASSET_WORKER_MAX_CONCURRENCY:-2}
      BLENDER_VERSION: 5.1.2
      BLENDER_SKILL_VERSION: ${BLENDER_SKILL_VERSION:-blender-retopology-direct-v2.0.0}
      UV_SKILL_ROOT: /opt/codex/skills/blender-pbr-uv
      RETOPOLOGY_SKILL_ROOT: /opt/li3d/retopology-direct-v2/blender-retopology-compare-iterate
      RETOPOLOGY_DIRECT_V2_ROOT: /opt/li3d/retopology-direct-v2
      CODEX_SKILLS_ROOT: /opt
      RETOPOFLOW_ADDON_ROOT: /opt/blender-addons/RetopoFlow
      CODEX_BINARY: /usr/local/bin/codex
      CODEX_AUTH_SOURCE: /run/secrets/codex-auth.json
      CODEX_RUNTIME_HOME: /home/assetworker/.codex
      CODEX_JOB_TIMEOUT_SECONDS: ${CODEX_JOB_TIMEOUT_SECONDS:-7200}
      SSL_CERT_FILE: /run/certs/lan-ca.crt
    volumes:
      - ${LAN_CA_PATH:-/opt/gpu-control/deploy/control-plane/nginx/certs/lan-ca.crt}:/run/certs/lan-ca.crt:ro
      - ${CODEX_SKILL_ROOT:-/opt/gpu-control/runtime/asset-skills}:/opt/codex/skills:ro
      - ${CODEX_BINARY_PATH:-/opt/gpu-control/runtime/codex/codex}:/usr/local/bin/codex:ro
      - ${CODEX_ASSET_AUTH_PATH:-/home/lilithgames/.codex/auth.json}:/run/secrets/codex-auth.json:ro
      - ${CODEX_RUNTIME_ROOT:-/opt/gpu-control/runtime/codex}/${NODE_ID}-direct-v2-home:/home/assetworker/.codex
      - ${RETOPOFLOW_RUNTIME_ROOT:-/opt/gpu-control/runtime/retopoflow/RetopoFlow}:/opt/blender-addons/RetopoFlow:ro
    logging: *default-logging

volumes:
  alloy-data: {}
