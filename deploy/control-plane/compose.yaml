name: gpu-control

x-logging: &default-logging
  driver: json-file
  options: {max-size: "20m", max-file: "5"}
x-app: &app
  env_file: ../../.env
  restart: unless-stopped
  logging: *default-logging
  networks: [backend]

services:
  nginx:
    image: nginx:1.28.0-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      api: {condition: service_healthy}
      asset-api: {condition: service_healthy}
      web: {condition: service_healthy}
    healthcheck: {test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health/live"], interval: 15s, timeout: 3s, retries: 5}
    logging: *default-logging
    networks: [frontend, backend]

  api:
    <<: *app
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      args:
        GPU_CONTROL_VERSION: ${GPU_CONTROL_VERSION:-1.5.12}
        GPU_CONTROL_REVISION: ${GPU_CONTROL_REVISION:-unknown}
      sbom: true
      provenance: mode=max
    image: ${GPU_CONTROL_IMAGE_REGISTRY:-}gpu-control-api:${APP_IMAGE_TAG:-1.5.12}
    # Starlette spools large multipart uploads before the endpoint streams the
    # archive into its batch layout. Keep that temporary file on the mounted
    # job filesystem instead of the container overlay.
    environment:
      TMPDIR: /srv/gpu-control/jobs
      ASSET_ROOT: ${ASSET_ROOT:-/srv/gpu-control/assets}
    volumes:
      - ${JOB_ROOT:-/srv/gpu-control/jobs}:/srv/gpu-control/jobs
      - ${ASSET_ROOT:-/srv/gpu-control/assets}:/srv/gpu-control/assets
      - ../../configs/nodes.yaml:/app/configs/nodes.yaml:ro
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck: {test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live',timeout=2)"], interval: 15s, timeout: 3s, retries: 5}

  asset-api:
    <<: *app
    build:
      context: ../..
      dockerfile: apps/asset_api/Dockerfile
      args:
        GPU_CONTROL_VERSION: ${GPU_CONTROL_VERSION:-1.5.12}
        GPU_CONTROL_REVISION: ${GPU_CONTROL_REVISION:-unknown}
      sbom: true
      provenance: mode=max
    image: ${GPU_CONTROL_IMAGE_REGISTRY:-}unified-scheduler-asset-api:${ASSET_API_IMAGE_TAG:-1.6.18-retopo-progress-v1}
    environment:
      TMPDIR: /srv/gpu-control/assets
      ASSET_ROOT: ${ASSET_ROOT:-/srv/gpu-control/assets}
      UV_QA_ENFORCEMENT: ${UV_QA_ENFORCEMENT:-advisory}
      RETOPOLOGY_QA_ENFORCEMENT: ${RETOPOLOGY_QA_ENFORCEMENT:-advisory}
    volumes:
      - ${ASSET_ROOT:-/srv/gpu-control/assets}:/srv/gpu-control/assets
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck: {test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health/live',timeout=2)"], interval: 15s, timeout: 3s, retries: 5}

  asset-worker-control:
    profiles: ["asset-plane"]
    build:
      context: ../..
      dockerfile: apps/blender_worker/Dockerfile
      args:
        BLENDER_BASE_IMAGE: ${BLENDER_BASE_IMAGE:-li3d/blender-runtime:5.1.2}
        ASSET_WORKER_VERSION: ${ASSET_WORKER_VERSION:-1.4.19-retopo-progress-v1}
        GPU_CONTROL_REVISION: ${GPU_CONTROL_REVISION:-unknown}
    image: li3d/blender-worker:${ASSET_WORKER_IMAGE_TAG:-1.4.19-retopo-progress-v1}
    restart: unless-stopped
    # Codex workspace-write uses bubblewrap inside the already isolated Worker
    # container. SYS_ADMIN plus unconfined seccomp/AppArmor are required for
    # the nested mount namespace; business inputs remain limited to the job
    # workspace by Codex's own sandbox.
    cap_add: [SYS_ADMIN]
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    environment:
      ASSET_API_URL: http://asset-api:8010
      ASSET_WORKER_ID: asset-control-4090
      ASSET_NODE_ID: control-4090
      ASSET_WORKER_DISPLAY_NAME: 4090 CPU Worker
      ASSET_WORKER_HMAC_SECRET: ${ASSET_WORKER_HMAC_SECRET}
      ASSET_WORKER_MAX_CONCURRENCY: ${ASSET_WORKER_MAX_CONCURRENCY_CONTROL:-2}
      BLENDER_VERSION: 5.1.2
      BLENDER_SKILL_VERSION: ${BLENDER_SKILL_VERSION:-asset-skills-retopology-v2.3.0}
      UV_SKILL_ROOT: /opt/codex/skills/blender-pbr-uv
      ALIGNMENT_SKILL_ROOT: /opt/codex/skills/blender-align-bake-models
      RETOPOLOGY_SKILL_ROOT: /opt/li3d/retopology-v6/skill/blender-retopology-compare-iterate
      RETOPOLOGY_V6_ROOT: /opt/li3d/retopology-v6
      RETOPOLOGY_DIRECT_V2_ROOT: /opt/li3d/retopology-direct-v2
      CODEX_SKILLS_ROOT: /opt
      RETOPOFLOW_ADDON_ROOT: /opt/blender-addons/RetopoFlow
      CODEX_BINARY: /usr/local/bin/codex
      CODEX_AUTH_SOURCE: /run/secrets/codex-auth.json
      CODEX_RUNTIME_HOME: /home/assetworker/.codex
      CODEX_JOB_TIMEOUT_SECONDS: ${CODEX_JOB_TIMEOUT_SECONDS:-7200}
    volumes:
      - ${CODEX_SKILL_ROOT:-/opt/gpu-control/runtime/asset-skills}:/opt/codex/skills:ro
      - ${CODEX_BINARY_PATH:-/opt/gpu-control/runtime/codex/codex}:/usr/local/bin/codex:ro
      - ${CODEX_ASSET_AUTH_PATH:-/home/lilithgames/.codex/auth.json}:/run/secrets/codex-auth.json:ro
      - ${CODEX_RUNTIME_ROOT:-/opt/gpu-control/runtime/codex}/${CODEX_RUNTIME_HOME_DIR:-control-4090-retopology-v6-home}:/home/assetworker/.codex
      - ${RETOPOFLOW_RUNTIME_ROOT:-/opt/gpu-control/runtime/retopoflow/RetopoFlow}:/opt/blender-addons/RetopoFlow:ro
    depends_on:
      asset-api: {condition: service_healthy}
    logging: *default-logging
    networks: [backend]

  scheduler:
    <<: *app
    build:
      context: ../..
      dockerfile: apps/scheduler/Dockerfile
      args:
        GPU_CONTROL_VERSION: ${GPU_CONTROL_VERSION:-1.5.12}
        GPU_CONTROL_REVISION: ${GPU_CONTROL_REVISION:-unknown}
      sbom: true
      provenance: mode=max
    image: ${GPU_CONTROL_IMAGE_REGISTRY:-}gpu-control-scheduler:${APP_IMAGE_TAG:-1.5.12}
    volumes:
      - ${JOB_ROOT:-/srv/gpu-control/jobs}:/srv/gpu-control/jobs
      - /run/gpu-control:/run/gpu-control:ro
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck: {test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9108/metrics',timeout=2)"], interval: 15s, timeout: 3s, retries: 5}

  web:
    image: ${GPU_CONTROL_IMAGE_REGISTRY:-}gpu-control-web:${WEB_IMAGE_TAG:-1.5.11-retopo-direct-v2}
    build:
      context: ../../apps/web
      args:
        VITE_MODELVIEW_PROMPT_ENABLED: ${VITE_MODELVIEW_PROMPT_ENABLED:-false}
        GPU_CONTROL_VERSION: ${GPU_CONTROL_VERSION:-1.5.12}
        GPU_CONTROL_REVISION: ${GPU_CONTROL_REVISION:-unknown}
      sbom: true
      provenance: mode=max
    restart: unless-stopped
    healthcheck: {test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"], interval: 15s, timeout: 3s, retries: 5}
    logging: *default-logging
    networks: [backend]

  postgres:
    image: postgres:17.5-bookworm
    restart: unless-stopped
    environment: {POSTGRES_DB: "${POSTGRES_DB}", POSTGRES_USER: "${POSTGRES_USER}", POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"], interval: 10s, timeout: 5s, retries: 10}
    logging: *default-logging
    networks: [backend]

  redis:
    image: redis:8.0.3-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes: [redis-data:/data]
    healthcheck: {test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD --no-auth-warning ping | grep PONG"], interval: 10s, timeout: 3s, retries: 10}
    environment: {REDIS_PASSWORD: "${REDIS_PASSWORD}"}
    logging: *default-logging
    networks: [backend]

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=30d"]
    volumes: ["../../configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro", "./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro", "prometheus-data:/prometheus"]
    healthcheck: {test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/healthy"], interval: 15s, timeout: 3s, retries: 5}
    logging: *default-logging
    networks: [backend]

  alertmanager:
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager"]
    volumes: ["./alertmanager:/etc/alertmanager:ro", "alertmanager-data:/alertmanager", "/srv/gpu-control/secrets/alertmanager_webhook_token:/run/secrets/alertmanager_webhook_token:ro"]
    healthcheck: {test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9093/-/healthy"], interval: 15s, timeout: 3s, retries: 5}
    logging: *default-logging
    networks: [backend]

  grafana:
    image: grafana/grafana:12.0.2
    restart: unless-stopped
    environment: {GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD}", GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/", GF_SERVER_SERVE_FROM_SUB_PATH: "true"}
    volumes: ["./grafana/provisioning:/etc/grafana/provisioning:ro", "./grafana/dashboards:/var/lib/grafana/dashboards:ro", "grafana-data:/var/lib/grafana"]
    healthcheck: {test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/api/health"], interval: 15s, timeout: 3s, retries: 5}
    logging: *default-logging
    networks: [backend]

  loki:
    image: grafana/loki:3.5.1
    restart: unless-stopped
    ports: ["${CONTROL_HOST:-192.168.10.10}:3100:3100"]
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes: ["./loki:/etc/loki:ro", "loki-data:/loki"]
    healthcheck: {test: ["CMD", "/usr/bin/loki", "-verify-config", "-config.file=/etc/loki/loki.yaml"], interval: 30s, timeout: 5s, retries: 3}
    logging: *default-logging
    networks: [backend]

  alloy:
    image: grafana/alloy:v1.9.1
    restart: unless-stopped
    command: ["run", "/etc/alloy/config.alloy", "--storage.path=/var/lib/alloy/data"]
    volumes: ["./alloy/control.alloy:/etc/alloy/config.alloy:ro", "/var/run/docker.sock:/var/run/docker.sock:ro", "/var/log/journal:/var/log/journal:ro", "/run/log/journal:/run/log/journal:ro", "/etc/machine-id:/etc/machine-id:ro", "alloy-data:/var/lib/alloy/data"]
    depends_on: {loki: {condition: service_healthy}}
    logging: *default-logging
    networks: [backend]

  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    command: ["--path.rootfs=/host"]
    volumes: ["/:/host:ro,rslave"]
    logging: *default-logging
    networks: [backend]

  dcgm-exporter:
    image: nvcr.io/nvidia/k8s/dcgm-exporter:4.2.3-4.1.1-ubuntu22.04
    restart: unless-stopped
    deploy: {resources: {reservations: {devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]}}}
    cap_add: [SYS_ADMIN]
    logging: *default-logging
    networks: [backend]

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    restart: unless-stopped
    environment: {DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"}
    depends_on: {postgres: {condition: service_healthy}}
    logging: *default-logging
    networks: [backend]

  redis-exporter:
    image: oliver006/redis_exporter:v1.74.0
    restart: unless-stopped
    environment: {REDIS_ADDR: "redis://redis:6379", REDIS_PASSWORD: "${REDIS_PASSWORD}"}
    depends_on: {redis: {condition: service_healthy}}
    logging: *default-logging
    networks: [backend]

  comfyui-4090:
    image: ${COMFY_IMAGE:-registry.local:5000/gpu-control/comfyui:projects-0.2.3}
    profiles: ["4090-gpu"]
    restart: unless-stopped
    deploy: {resources: {reservations: {devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]}}}
    volumes:
      - ${MODEL_ROOT:-/opt/imageclip/models}:/opt/comfyui/models:ro
      - ${MODELVIEW_ROOT:-/opt/modelviewcreator}/model:/opt/modelviewcreator/model:ro
      - ../../configs/comfyui-extra-model-paths.yaml:/opt/comfyui/extra_model_paths.yaml:ro
      - ${IMAGECLIP_ROOT:-/opt/imageclip}/Cherry_lizi:/opt/comfyui/custom_nodes/Cherry_lizi:ro
      - ${MODELVIEW_ROOT:-/opt/modelviewcreator}/custom_nodes/haoze-LiClick:/opt/comfyui/custom_nodes/haoze-LiClick:ro
      - /srv/comfyui/4090/input:/opt/comfyui/input
      - /srv/comfyui/4090/output:/opt/comfyui/output
      - /srv/comfyui/4090/temp:/opt/comfyui/temp
      - /srv/comfyui/4090/user:/opt/comfyui/user
      - ${IMAGECLIP_ROOT:-/opt/imageclip}/ImageClip.json:/opt/comfyui/user/default/workflows/ImageClip.json:ro
      - ${MODELVIEW_ROOT:-/opt/modelviewcreator}/flux_fill_inpaint.json:/opt/comfyui/user/default/workflows/ModelViewCreator_flux_fill_inpaint.json:ro
    healthcheck: {test: ["CMD", "python3.11", "/usr/local/bin/comfy-healthcheck"], interval: 20s, timeout: 5s, start_period: 120s, retries: 6}
    logging: *default-logging
    networks: [backend]

networks:
  frontend: {}
  # Scheduler/API need egress to LAN ComfyUI nodes, callbacks and Feishu.
  # PostgreSQL/Redis remain private because they publish no host ports.
  backend: {}

volumes:
  postgres-data: {}
  redis-data: {}
  prometheus-data: {}
  alertmanager-data: {}
  grafana-data: {}
  loki-data: {}
  alloy-data: {}
