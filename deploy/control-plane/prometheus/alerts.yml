groups:
  - name: gpu-control
    rules:
      - {alert: SchedulerLoopLag, expr: "gpu_control_scheduler_loop_lag_seconds > 2", for: 2m, labels: {severity: warning}, annotations: {summary: "调度器循环延迟过高", action: "检查 PostgreSQL 与 scheduler 日志"}}
      - {alert: QueueBacklog, expr: "gpu_control_jobs_queued > 50", for: 5m, labels: {severity: warning}, annotations: {summary: "任务队列持续积压", action: "检查所有 GPU 节点健康和工作流兼容性"}}
      - {alert: OldestJobWaiting, expr: "gpu_control_oldest_queued_job_seconds > 600", for: 2m, labels: {severity: critical}, annotations: {summary: "最老任务等待超过 10 分钟", action: "检查节点模式、模型与 ComfyUI 队列"}}
      - {alert: NodeDown, expr: "up{job=~\"workers|control-node\"} == 0", for: 1m, labels: {severity: critical}, annotations: {summary: "GPU 节点指标中断", action: "检查网络、Exporter 和节点电源"}}
      - {alert: WSLComfyUnhealthy, expr: "gpu_control_node_health{node_id=~\"worker-3090-b|worker-4070ti-animation-host-01\"} == 0", for: 30s, labels: {severity: warning}, annotations: {summary: "WSL2 GPU 节点的 ComfyUI 持续不可用", action: "检查 Windows/WSL2 界面、端口转发、ComfyUI 与 Node Agent；不要在运行任务时直接重启"}}
      - {alert: WSLNodeHealthFlapping, expr: "changes(gpu_control_node_health{node_id=~\"worker-3090-b|worker-4070ti-animation-host-01\"}[10m]) >= 4", for: 1m, labels: {severity: warning}, annotations: {summary: "WSL2 GPU 节点在 10 分钟内反复上下线", action: "检查 WSL2、宿主网络、GPU 驱动和 ComfyUI 健康日志"}}
      - {alert: WSLSystemProbeMissing, expr: "gpu_control_wsl_system_probe_up{node_id=~\"worker-3090-b|worker-4070ti-animation-host-01\"} == 0", for: 2m, labels: {severity: warning}, annotations: {summary: "WSL2 GPU 节点深度状态探针持续不可用", action: "检查 9201 Node Agent、WSL2 内核状态和 HMAC 配置；该告警本身不会将节点下线"}}
      - {alert: WSLMemoryPressure, expr: "gpu_control_wsl_memory_available_ratio{node_id=~\"worker-3090-b|worker-4070ti-animation-host-01\"} < 0.08 or gpu_control_wsl_pressure_avg10{node_id=~\"worker-3090-b|worker-4070ti-animation-host-01\",resource=\"memory\",level=\"full\"} > 10", for: 2m, labels: {severity: warning}, annotations: {summary: "WSL2 GPU 节点内存或内存阻塞压力持续过高", action: "先 Drain 并等待当前任务结束，再检查 WSL2 内存、交换分区和 Windows 后台进程"}}
      - {alert: WSLSustainedLoad, expr: "gpu_control_wsl_load1_per_cpu{node_id=~\"worker-3090-b|worker-4070ti-animation-host-01\"} > 1.5", for: 5m, labels: {severity: warning}, annotations: {summary: "WSL2 GPU 节点持续超出可见 CPU 容量", action: "检查 WSL2 CPU 配额、异常进程和宿主负载；不要直接修改业务工作流"}}
      - {alert: WSLBootChanged, expr: "increase(gpu_control_wsl_boot_changes_total{node_id=~\"worker-3090-b|worker-4070ti-animation-host-01\"}[5m]) > 0", labels: {severity: warning}, annotations: {summary: "WSL2 GPU 节点内核已发生重启", action: "核对重启是否已授权，并验证 8188、9201、容器健康、GPU 与任务恢复"}}
      - {alert: WSLGPUHot, expr: "gpu_control_node_gpu_temperature_c{node_id=~\"worker-3090-b|worker-4070ti-animation-host-01\"} > 85", for: 5m, labels: {severity: critical}, annotations: {summary: "WSL2 GPU 温度持续超过 85°C", action: "先 Drain 并等待任务结束，再检查 Windows/WSL2 散热、功耗与后台负载"}}
      - {alert: WSLImageClipSevereSlowdown, expr: "gpu_control_wsl_imageclip_performance_anomaly{node_id=\"worker-3090-b\"} == 1", for: 2m, labels: {severity: warning}, annotations: {summary: "3090-B 抠图速度持续超过原生 3090-A 的 2 倍", action: "先 Drain 3090-B，再检查 WSL2 状态、GPU 温度/功耗/驱动和后台进程"}}
      - {alert: GPUHot, expr: "DCGM_FI_DEV_GPU_TEMP > 85", for: 5m, labels: {severity: critical}, annotations: {summary: "GPU 温度过高", action: "Drain 节点并检查散热"}}
      - {alert: DiskLow, expr: "node_filesystem_avail_bytes{mountpoint=\"/srv\"}/node_filesystem_size_bytes{mountpoint=\"/srv\"} < 0.1", for: 5m, labels: {severity: critical}, annotations: {summary: "/srv 磁盘不足", action: "预览并执行保留策略清理"}}
