events { worker_connections 2048; }
http {
  include /etc/nginx/mime.types;
  limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
  server_tokens off;
  client_max_body_size 55m;
  server { listen 80; location = /health/live { return 200 "live\n"; } location / { return 301 https://$host$request_uri; } }
  server {
    listen 443 ssl http2;
    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    location /api/ { limit_req zone=api burst=20 nodelay; proxy_pass http://api:8000; proxy_request_buffering off; proxy_set_header X-Request-ID $request_id; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location /admin/ { proxy_pass http://api:8000; proxy_set_header X-Request-ID $request_id; }
    location ^~ /internal/ { return 404; }
    location /health/ { proxy_pass http://api:8000; }
    location /grafana/ { proxy_pass http://grafana:3000; }
    location / { proxy_pass http://web:80; }
  }
}
