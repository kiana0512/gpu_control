events { worker_connections 2048; }
http {
  include /etc/nginx/mime.types;
  limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
  limit_req_zone $binary_remote_addr zone=admin:10m rate=5r/s;
  limit_conn_zone $binary_remote_addr zone=per_ip_connections:10m;
  limit_req_status 429;
  limit_conn_status 429;
  server_tokens off;
  # Batch matting accepts archives up to 100 GiB at the application layer.
  # Keep one GiB of multipart/header headroom at the edge and stream the body
  # directly to FastAPI instead of buffering it in Nginx.
  client_max_body_size 101g;
  client_body_timeout 86400s;
  # Docker service IPs can change when a single container is recreated. Resolve
  # service names continuously so the long-lived reverse proxy does not retain
  # a stale API/Web/Grafana address and return 502 until it is restarted.
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 2s;
  server { listen 80; location = /health/live { return 200 "live\n"; } location / { return 301 https://$host$request_uri; } }
  server {
    listen 443 ssl http2;
    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    location ^~ /api/v1/assets/ { set $asset_api_upstream http://asset-api:8010; limit_req zone=api burst=20 nodelay; limit_conn per_ip_connections 20; proxy_pass $asset_api_upstream; proxy_request_buffering off; proxy_buffering off; proxy_cache off; proxy_read_timeout 86400s; proxy_send_timeout 86400s; proxy_set_header X-Request-ID $request_id; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header Last-Event-ID $http_last_event_id; }
    location /api/ { set $api_upstream http://api:8000; limit_req zone=api burst=20 nodelay; limit_conn per_ip_connections 20; proxy_pass $api_upstream; proxy_request_buffering off; proxy_read_timeout 86400s; proxy_send_timeout 86400s; proxy_set_header X-Request-ID $request_id; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $remote_addr; }
    location /admin/ { set $api_upstream http://api:8000; limit_req zone=admin burst=10 nodelay; limit_conn per_ip_connections 10; proxy_pass $api_upstream; proxy_set_header X-Request-ID $request_id; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $remote_addr; }
    location ^~ /internal/v1/assets/ { allow 10.3.34.0/24; deny all; set $asset_api_upstream http://asset-api:8010; proxy_pass $asset_api_upstream; proxy_request_buffering off; proxy_read_timeout 86400s; proxy_send_timeout 86400s; proxy_set_header X-Request-ID $request_id; proxy_set_header X-Real-IP $remote_addr; }
    location ^~ /internal/ { return 404; }
    location /health/ { set $api_upstream http://api:8000; proxy_pass $api_upstream; }
    location /grafana/ { set $grafana_upstream http://grafana:3000; proxy_pass $grafana_upstream; }
    location / { set $web_upstream http://web:80; proxy_pass $web_upstream; }
  }
}
