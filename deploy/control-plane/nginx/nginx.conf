events { worker_connections 2048; }
http {
  include /etc/nginx/mime.types;

  # The edge limit is a coarse per-source-IP safety ceiling. Authenticated
  # clients are additionally limited by the API's per-client RateLimitPolicy.
  # 240 r/s and 256 active requests leave headroom for the approved 120-VU
  # mixed workload without turning the gateway into an unbounded proxy.
  limit_req_zone $binary_remote_addr zone=business_api:10m rate=240r/s;
  limit_conn_zone $binary_remote_addr zone=business_connections:10m;

  # Control traffic must not consume, or be rejected by, the business zones.
  # Keep each class independent so capacity polling cannot starve heartbeats.
  limit_req_zone $binary_remote_addr zone=node_heartbeat:1m rate=10r/s;
  limit_conn_zone $binary_remote_addr zone=node_heartbeat_connections:1m;
  limit_req_zone $binary_remote_addr zone=scheduler_capacity:1m rate=60r/s;
  limit_conn_zone $binary_remote_addr zone=scheduler_capacity_connections:1m;
  limit_req_zone $binary_remote_addr zone=asset_capacity:1m rate=60r/s;
  limit_conn_zone $binary_remote_addr zone=asset_capacity_connections:1m;

  # Admin remains deliberately tighter and has its own connection budget.
  limit_req_zone $binary_remote_addr zone=admin:10m rate=5r/s;
  limit_conn_zone $binary_remote_addr zone=admin_connections:10m;
  limit_req_status 429;
  limit_conn_status 429;
  server_tokens off;
  # Batch matting accepts archives up to 100 GiB at the application layer.
  # Keep one GiB of multipart/header headroom at the edge and stream the body
  # directly to FastAPI instead of buffering it in Nginx.
  client_max_body_size 101g;
  client_body_timeout 86400s;
  # Docker service IPs can change when a single container is recreated. Resolve
  # service names continuously so the long-lived reverse proxy does not retain
  # a stale API/Web/Grafana address and return 502 until it is restarted.
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 2s;
  server {
    listen 80;
    location = /health/live { return 200 "live\n"; }
    # TLS bootstrap must be downloadable before a client trusts the LAN CA.
    location = /GPU_CONTROL_LAN_CA.crt { alias /etc/nginx/certs/lan-ca.crt; default_type application/x-x509-ca-cert; add_header Content-Disposition 'attachment; filename="GPU_CONTROL_LAN_CA.crt"'; add_header Cache-Control 'public, max-age=86400'; }
    location / { return 301 https://$host$request_uri; }
  }
  server {
    listen 443 ssl;
    http2 on;
    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    # Public root certificate only. This contains no private key and lets LAN
    # API clients bootstrap TLS without using curl -k.
    location = /GPU_CONTROL_LAN_CA.crt { alias /etc/nginx/certs/lan-ca.crt; default_type application/x-x509-ca-cert; add_header Content-Disposition 'attachment; filename="GPU_CONTROL_LAN_CA.crt"'; add_header Cache-Control 'public, max-age=86400'; }
    location = /api/v1/nodes/heartbeat {
      set $api_upstream http://api:8000;
      limit_req zone=node_heartbeat burst=20 nodelay;
      limit_conn node_heartbeat_connections 16;
      proxy_pass $api_upstream;
      proxy_request_buffering off;
      proxy_read_timeout 30s;
      proxy_send_timeout 30s;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
    }
    location = /api/v1/scheduler/capacity {
      set $api_upstream http://api:8000;
      limit_req zone=scheduler_capacity burst=120 nodelay;
      limit_conn scheduler_capacity_connections 64;
      proxy_pass $api_upstream;
      proxy_read_timeout 30s;
      proxy_send_timeout 30s;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
    }
    location = /api/v1/assets/capacity {
      set $asset_api_upstream http://asset-api:8010;
      limit_req zone=asset_capacity burst=120 nodelay;
      limit_conn asset_capacity_connections 64;
      proxy_pass $asset_api_upstream;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 30s;
      proxy_send_timeout 30s;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
    }
    location ^~ /api/v1/assets/ {
      set $asset_api_upstream http://asset-api:8010;
      limit_req zone=business_api burst=480 nodelay;
      limit_conn business_connections 256;
      proxy_pass $asset_api_upstream;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 86400s;
      proxy_send_timeout 86400s;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header Last-Event-ID $http_last_event_id;
    }
    location /api/ {
      set $api_upstream http://api:8000;
      limit_req zone=business_api burst=480 nodelay;
      limit_conn business_connections 256;
      proxy_pass $api_upstream;
      proxy_request_buffering off;
      proxy_read_timeout 86400s;
      proxy_send_timeout 86400s;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
    }
    location /admin/ {
      set $api_upstream http://api:8000;
      limit_req zone=admin burst=10 nodelay;
      limit_conn admin_connections 10;
      proxy_pass $api_upstream;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
    }
    location ^~ /internal/v1/assets/ { allow 10.3.34.0/24; deny all; set $asset_api_upstream http://asset-api:8010; proxy_pass $asset_api_upstream; proxy_request_buffering off; proxy_read_timeout 86400s; proxy_send_timeout 86400s; proxy_set_header X-Request-ID $request_id; proxy_set_header X-Real-IP $remote_addr; }
    location ^~ /internal/ { return 404; }
    location /health/ { set $api_upstream http://api:8000; proxy_pass $api_upstream; }
    location /grafana/ { set $grafana_upstream http://grafana:3000; proxy_pass $grafana_upstream; }
    location / { set $web_upstream http://web:80; proxy_pass $web_upstream; }
  }
}
